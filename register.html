<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CampusMarket | Register</title>
  <link rel="stylesheet" href="styles.css">
  <script src="app.js" defer></script>
</head>
<body>
  <header>
    <div class="logo-container">
      <h1>CampusMarket</h1>
      <p class="tagline">Your University Marketplace</p>
    </div>
    <nav>
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="catalog.html">Catalog</a></li>
        <li><a href="register.html" class="active">Register</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <section class="form-container">
      <h2>Create Your Student Account</h2>
      
      <!-- Submission Feedback Alert -->
      <div id="successBanner" class="success-banner hidden">
        <div class="checkmark-icon">&#10004;</div>
        <h3>Registration Successful!</h3>
        <p>Welcome to CampusMarket. You can now start trading.</p>
      </div>

      <form id="registrationForm" novalidate>
        <div class="form-group">
          <label for="fullName">Full Name</label>
          <input type="text" id="fullName" name="fullName" placeholder="Jane Doe">
          <span class="error-msg" id="nameError"></span>
        </div>

        <div class="form-group">
          <label for="email">Campus Email</label>
          <input type="email" id="email" name="email" placeholder="student@university.ac.ke">
          <span class="error-msg" id="emailError"></span>
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" placeholder="At least 6 characters">
          <span class="error-msg" id="passwordError"></span>
        </div>

        <div class="form-group">
          <label for="confirmPassword">Confirm Password</label>
          <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Re-enter password">
          <span class="error-msg" id="confirmPasswordError"></span>
        </div>

        <button type="submit" id="submitBtn" class="btn">Register</button>
      </form>
    </section>
  </main>

  <footer>
    <p>&copy; 2026 CampusMarket. CIT 227 Semester Project.</p>
  </footer>
</body>
</html>
