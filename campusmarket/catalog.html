<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CampusMarket | Catalog</title>
  <link rel="stylesheet" href="styles.css">
  <script src="app.js" defer></script>
</head>
<body>
  <header>
    <div class="logo-container">
      <h1>CampusMarket</h1>
      <p class="tagline">Your University Marketplace</p>
    </div>
    <nav>
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="catalog.html" class="active">Catalog</a></li>
        <li><a href="cart.html">Cart <span id="navCartCount" class="cart-badge">0</span></a></li>
        <li><a href="register.html">Register</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <section class="catalog-controls">
      <h2>Product Catalog</h2>
      <div class="filter-bar">
        <input type="text" id="searchInput" placeholder="Search products..." aria-label="Search products">
        <select id="categorySelect" aria-label="Filter by category">
          <option value="all">All Categories</option>
          <option value="books">Textbooks</option>
          <option value="tech">Electronics</option>
          <option value="lifestyle">Lifestyle</option>
        </select>
        <select id="sortSelect" aria-label="Sort products">
          <option value="featured">Sort: Featured</option>
          <option value="price-asc">Price: Low to High</option>
          <option value="price-desc">Price: High to Low</option>
          <option value="name-asc">Name: A&ndash;Z</option>
        </select>
      </div>
      <p id="resultCount" class="result-count" aria-live="polite"></p>
    </section>

    <!-- Dynamic Integrated Gallery -->
    <section class="gallery-section">
      <h3>Featured Showcase</h3>
      <div class="gallery-container">
        <button id="prevBtn" class="gallery-btn" aria-label="Previous Slide">&larr;</button>
        <div class="gallery-slide">
          <img id="galleryImg" src="https://pictures.abebooks.com/isbn/9780618502981-us.jpg" alt="Calculus textbook cover">
          <p id="galleryCaption">Featured Product Showcase</p>
        </div>
        <button id="nextBtn" class="gallery-btn" aria-label="Next Slide">&rarr;</button>
      </div>
      <div id="galleryDots" class="gallery-dots" role="tablist" aria-label="Gallery navigation"></div>
    </section>

    <!-- Product Grid -->
    <section class="products-grid" id="productsContainer">
      <!-- Populated via JavaScript -->
    </section>

    <section class="cart-summary">
      <h3>Running Order Subtotal</h3>
      <div id="subtotalMessage" class="subtotal-box">
        Total: <span id="runningTotal">KES 0.00</span>
      </div>
      <p id="subtotalItems" class="subtotal-items"></p>
      <p id="calcError" class="error-text hidden"></p>
      <a href="cart.html" class="btn">View Cart</a>
    </section>
  </main>

  <footer>
    <p>&copy; 2026 CampusMarket. CIT 227 Semester Project.</p>
  </footer>
</body>
</html>
